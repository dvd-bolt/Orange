name: CI

on:
  pull_request:
  push:
    branches: [main, orangeV2]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: maturin develop --release
        working-directory: orange_core
      - run: python -c "import orange_core; assert hasattr(orange_core, 'scan_vault_fast')"
      - run: python -m compileall main.py check_models.py core integrations
      - run: pytest

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check
        working-directory: orange_core

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: mcp_servers
      - run: bunx tsc --noEmit
        working-directory: mcp_servers
