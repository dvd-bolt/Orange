name: CI

on:
  pull_request:
  push:
    branches: [main, orangeV2]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install ./orange_core
      - run: python -m playwright install --with-deps chromium
      - run: python -c "import orange_core; notes = orange_core.scan_vault_fast('examples/test_vault'); assert isinstance(notes, list) and notes"
      - run: python -m compileall main.py check_models.py core integrations tests
      - run: pip check
      - run: pytest

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
        working-directory: orange_core
      - run: cargo check
        working-directory: orange_core

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check ui/bridge_client.js
      - run: node --check ui/chat.js
      - run: node --check ui/settings.js
      - run: node --check ui/feature_dialogs.js
      - run: node --check ui/graph.js
      - run: node --check ui/main.js
      - run: node --check ui/tailwind.config.js

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: mcp_servers
      - run: bunx tsc --noEmit
        working-directory: mcp_servers
      - run: bun test
        working-directory: mcp_servers
